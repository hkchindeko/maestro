[project]
name = "maestro"
version = "0.1.0"
description = "Python implementation of the OpenAI Symphony specification — orchestrates coding agents to execute issue tracker work autonomously"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "typer>=0.12",
    "rich>=13.0",
    "watchdog>=4.0",
    "httpx>=0.27",
]

[project.scripts]
maestro = "maestro.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
